name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=4 -Dorg.gradle.caching=true"

jobs:
  # ── Dependency Resolution ──────────────────────────────────────
  resolve-deps:
    name: Resolve Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Resolve all dependencies
        run: |
          gradle dependencies --no-daemon --no-configuration-cache \
            | tee deps.log
          echo ''
          echo '=== Dependency Resolution Summary ==='
          if grep -qiE 'FAIL|could not resolve|could not find' deps.log; then
            echo '::error::Dependency resolution failed'
            grep -iE 'FAIL|could not resolve|could not find' deps.log
            exit 1
          else
            echo 'All dependencies resolved successfully'
          fi

      - name: Upload dependency log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-log
          path: deps.log
          retention-days: 7

  # ── Build ──────────────────────────────────────────────────────
  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    needs: resolve-deps
    timeout-minutes: 30
    outputs:
      build_status: ${{ steps.build-result.status }}
      error_count: ${{ steps.build-result.outputs.error_count }}
      warning_count: ${{ steps.build-result.outputs.warning_count }}
      has_apk: ${{ steps.check-apk.outputs.has_apk }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Compile all modules
        id: build-result
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --no-configuration-cache 2>&1 | tee build.log
          echo ''
          # Error summary
          ERROR_COUNT=$(grep -c '^e: ' build.log 2>/dev/null || true)
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT
          echo ''
          echo "=== Error Summary ($ERROR_COUNT errors) ==="
          grep -E '^e: ' build.log || echo 'No compilation errors'
          echo ''
          # Warning count
          WARN_COUNT=$(grep -c '^w: ' build.log 2>/dev/null || true)
          echo "warning_count=$WARN_COUNT" >> $GITHUB_OUTPUT
          echo "=== Warning Count: $WARN_COUNT ==="
          echo ''
          # Per-module error breakdown
          echo '=== Per-Module Errors ==='
          grep -E '^e: file://.*' build.log | \
            sed 's|.*xcoder-ide/||' | \
            sed 's|/src/.*|:|' | \
            cut -d: -f1 | \
            sort | uniq -c | sort -rn || echo 'No module errors'

      - name: Check for APK output
        id: check-apk
        if: always()
        run: |
          if ls app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            echo "has_apk=true" >> $GITHUB_OUTPUT
            ls -lh app/build/outputs/apk/debug/*.apk
          else
            echo "has_apk=false" >> $GITHUB_OUTPUT
            echo 'No APK produced'
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload debug APK
        if: steps.check-apk.outputs.has_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: xcoder-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "### Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${GITHUB_SHA:0:7}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Errors:** ${{ steps.build-result.outputs.error_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Warnings:** ${{ steps.build-result.outputs.warning_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Module build status
          echo '### Module Build Status' >> $GITHUB_STEP_SUMMARY
          echo '| Module | Status |' >> $GITHUB_STEP_SUMMARY
          echo '|--------|--------|' >> $GITHUB_STEP_SUMMARY
          for dir in app core/* editor/* visual-editor build-engine ai-copilot search-in-project code-formatter bookmarks apk-editor remote-filesystem lsp-java plugin-system/*; do
            if [ -d "$dir" ] && [ -d "$dir/build" ]; then
              name=$(basename "$dir")
              if ls "$dir/build/intermediates/compile_library_classes_jar"/classes.jar 1>/dev/null 2>&1 || \
                 ls "$dir/build/intermediates/javac/debug/classes" 1>/dev/null 2>&1 || \
                 ls "$dir/build/outputs/apk/debug"/*.apk 1>/dev/null 2>&1; then
                echo "| \`$name\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
              else
                echo "| \`$name\` | ⚠️ Check log |" >> $GITHUB_STEP_SUMMARY
              fi
            elif [ -d "$dir" ]; then
              name=$(basename "$dir")
              echo "| \`$name\` | ❓ No build dir |" >> $GITHUB_STEP_SUMMARY
            fi
          done
          # APK info
          if [ "${{ steps.check-apk.outputs.has_apk }}" = 'true' ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '### APK Output' >> $GITHUB_STEP_SUMMARY
            ls -lh app/build/outputs/apk/debug/*.apk | awk '{print "- " $NF " (" $5 ")"}' >> $GITHUB_STEP_SUMMARY
          fi

  # ── Lint (blocking) ──────────────────────────────────────────
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run lint
        run: |
          set -o pipefail
          gradle lintDebug --no-daemon --build-cache --stacktrace --no-configuration-cache 2>&1 | tee lint.log
          echo ''
          echo '=== Lint Summary ==='
          LINT_ISSUES=$(grep -cE '^[A-Z]+:' lint.log 2>/dev/null || echo '0')
          echo "Found $LINT_ISSUES lint issues"

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-debug.html
            lint.log
          retention-days: 14

      - name: Lint summary
        if: always()
        run: |
          echo "### Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "Lint is a **blocking** quality gate. Any lint failure blocks the pipeline." >> $GITHUB_STEP_SUMMARY

  # ── Unit Tests ─────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --build-cache --stacktrace --no-configuration-cache 2>&1 | tee test.log
          echo ''
          echo '=== Test Summary ==='
          grep -E 'tests completed|tests? (passed|failed|skipped)' test.log || echo 'Check full log for results'

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 14

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -oP '\d+ tests' test.log 2>/dev/null | tail -1 || echo 'N/A')
          PASSED=$(grep -oP '\d+ passed' test.log 2>/dev/null | tail -1 || echo 'N/A')
          FAILED=$(grep -oP '\d+ failed' test.log 2>/dev/null | tail -1 || echo '0')
          echo "- **Tests:** $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- **Passed:** $PASSED" >> $GITHUB_STEP_SUMMARY
          echo "- **Failed:** $FAILED" >> $GITHUB_STEP_SUMMARY

  # ── CI Gate ───────────────────────────────────────────────────
  ci-gate:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [resolve-deps, build, lint, test]
    if: always()
    steps:
      - name: Check CI results
        run: |
          echo "### CI Pipeline Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          DEPS="${{ needs.resolve-deps.result }}"
          BUILD="${{ needs.build.result }}"
          LINT="${{ needs.lint.result }}"
          TEST="${{ needs.test.result }}"
          echo "| Resolve Deps | $DEPS |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | $BUILD |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | $LINT |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | $TEST |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$DEPS" != "success" ] || [ "$BUILD" != "success" ] || [ "$LINT" != "success" ] || [ "$TEST" != "success" ]; then
            echo '::error::CI failed — Resolve Dependencies, Build, Lint and Unit Tests must all pass'
            exit 1
          fi
          echo 'CI passed — all required jobs are green'
