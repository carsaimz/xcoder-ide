name: Gradle Setup

on:
  workflow_dispatch:
    inputs:
      gradle-version:
        description: 'Gradle version (e.g., 8.5, 8.7, 8.10.2)'
        required: false
        default: '8.5'

jobs:
 verify-gradle:
    name: Verify Gradle Installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle-version || '8.5' }}

      - name: Verify Gradle works
        run: |
          gradle --version
          echo "### Gradle OK" >> $GITHUB_STEP_SUMMARY
          gradle --version >> $GITHUB_STEP_SUMMARY
