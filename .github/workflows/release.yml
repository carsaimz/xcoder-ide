name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validate:
    name: Validate Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
      is_prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag info
        id: tag
        run: |
          TAG=${GITHUB_REF_NAME}
          if [[ -n "${{ inputs.tag }}" ]]; then TAG=${{ inputs.tag }}; fi
          VERSION=${TAG#v}
          
          if [[ "$VERSION" == *"-"* ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi
          if [[ "${{ inputs.prerelease }}" == "true" ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

  build-release:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (auto-generates wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Build release AAB
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: Prepare output
        run: |
          mkdir -p output
          VERSION="${{ needs.validate.outputs.version }}"
          cp app/build/outputs/apk/release/*.apk output/XCoder-IDE-${VERSION}.apk
          cp app/build/outputs/bundle/release/*.aab output/XCoder-IDE-${VERSION}.aab

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: output/*
          retention-days: 365

  generate-changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      changelog: ${{ steps.changelog.outputs.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog from git history
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: "${{ github.workspace }}/.github/changelog_configuration.json"
          fromTag: ${{ needs.validate.outputs.version }}
          toTag: ${{ github.sha }}

      - name: Save changelog
        run: |
          echo "${{ steps.changelog.outputs.body }}" > CHANGELOG_LATEST.md

      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG_LATEST.md

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate, build-release, generate-changelog]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: "XCoder IDE ${{ needs.validate.outputs.version }}"
          body_path: CHANGELOG_LATEST.md
          prerelease: ${{ needs.validate.outputs.is_prerelease }}
          generate_release_notes: false
          files: |
            artifacts/XCoder-IDE-*.apk
            artifacts/XCoder-IDE-*.aab
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-fdroid:
    name: Deploy to F-Droid (Manual)
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.validate.outputs.is_prerelease == 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: release

      - name: Info
        run: |
          echo "Release ${{ needs.validate.outputs.version }} ready for F-Droid submission"
          echo "Upload the AAB to Google Play or submit to F-Droid repo manually."
          ls -lh release/

  update-changelog-file:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    needs: [validate, generate-changelog]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Prepend to CHANGELOG.md
        run: |
          if [ -f CHANGELOG.md ]; then
            echo "" >> CHANGELOG.md
            cat CHANGELOG.md >> CHANGELOG_BODY.md
            mv CHANGELOG_BODY.md CHANGELOG.md
          fi
          cat CHANGELOG_LATEST.md > CHANGELOG_NEW.md
          echo "" >> CHANGELOG_NEW.md
          cat CHANGELOG.md >> CHANGELOG_NEW.md 2>/dev/null || true
          mv CHANGELOG_NEW.md CHANGELOG.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md for v${{ needs.validate.outputs.version }}"
          git push
