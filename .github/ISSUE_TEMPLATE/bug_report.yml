name: Bug Report
description: Report a bug in XCoder IDE
title: '[Bug] '
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: input
    id: version
    attributes:
      label: Version
      description: XCoder IDE version
      placeholder: '1.0.0'
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Device model and Android version
      placeholder: 'Pixel 7 / Android 14'

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output
      render: shell
