name: Gradle Wrapper Setup

on:
  push:
    branches: [main, develop]
    paths:
      - 'gradle/wrapper/gradle-wrapper.properties'
      - 'gradle/libs.versions.toml'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:
    inputs:
      gradle-version:
        description: 'Gradle version (e.g., 8.5, 8.7, 8.10.2)'
        required: false
        default: '8.5'

jobs:
 setup-wrapper:
    name: Generate Gradle Wrapper
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (auto-generates wrapper)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle-version || '8.5' }}

      - name: Verify wrapper works
        run: |
          ./gradlew --version
          echo "### Gradle Wrapper OK" >> $GITHUB_STEP_SUMMARY
          ./gradlew --version >> $GITHUB_STEP_SUMMARY

      - name: Commit wrapper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          CHANGES=$(git diff --staged --name-only)
          if [ -n "$CHANGES" ]; then
            git commit -m "chore: generate/update Gradle wrapper"
            git push
            echo "### Committed: $CHANGES" >> $GITHUB_STEP_SUMMARY
          else
            echo "### No changes to commit" >> $GITHUB_STEP_SUMMARY
          fi
