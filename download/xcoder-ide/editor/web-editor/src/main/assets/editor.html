  gotoLine(line) { Editor.setCursor(line, 1); },

  // ---- Comments ----
  toggleComment() {
    const lineIdx = Editor.cursorLine - 1;
    const lines = Editor.content.split('\n');
    const line = lines[lineIdx];
    const trimmed = line.trimStart();
    const commentMap = {kotlin:'//',java:'//',javascript:'//',typescript:'//',c_cpp:'//',groovy:'//',swift:'//',dart:'//',php:'//',go:'//',rust:'//',css:'/* */',python:'#',ruby:'#',bash:'#',yaml:'#',sql:'--',toml:'#',ini:';',properties:'#',makefile:'#',dockerfile:'#'};
    const commentChar = commentMap[Editor.language] || '//';
    if (commentChar === '#') {
      lines[lineIdx] = trimmed.startsWith('#') ? line.replace(/^(\s*)# ?/, '$1') : line.replace(/^(\s*)/, '$1# ');
    } else if (commentChar === '--') {
      lines[lineIdx] = trimmed.startsWith('--') ? line.replace(/^(\s*)-- ?/, '$1') : line.replace(/^(\s*)/, '$1-- ');
    } else if (commentChar === ';') {
      lines[lineIdx] = trimmed.startsWith(';') ? line.replace(/^(\s*); ?/, '$1') : line.replace(/^(\s*)/, '$1; ');
    } else if (commentChar === '/* */') {
      lines[lineIdx] = trimmed.startsWith('/*') ? line.replace(/\/\*.*?\*\//, '') : `/* ${trimmed} */`;
    } else {
      lines[lineIdx] = trimmed.startsWith('//') ? line.replace(/^(\s*\/\/ ?)/, '$1') : line.replace(/^(\s*)/, '$1// ');
    }
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  blockComment() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    if (!selectedText) { this.toggleComment(); return; }
    const commentMap = {kotlin:'/* */',java:'/* */',javascript:'/* */',typescript:'/* */',c_cpp:'/* */',css:'/* */',swift:'/* */',dart:'/* */',go:'/* */',rust:'/* */',php:'/* */',groovy:'/* */'};
    const commentStyle = commentMap[Editor.language] || '/* */';
    const newSel = `/* ${selectedText} */`;
    document.execCommand('insertText', false, newSel);
    Editor.content = document.getElementById('code-display').innerText.replace(/\n$/, '');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  // ---- Multi-cursor / Selection ----
  selectNextOccurrence() {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    let word = sel.toString().trim();
    if (!word) {
      // Expand to word under cursor
      const range = sel.getRangeAt(0);
      const preRange = range.cloneRange();
      preRange.selectNodeContents(document.getElementById('code-display'));
      preRange.setEnd(range.startContainer, range.startOffset);
      const text = preRange.toString();
      const lineText = text.split('\n').pop();
      const wordMatch = lineText.match(/\w+$/);
      if (wordMatch) {
        word = wordMatch[0];
        // Select the word
        const newRange = document.createRange();
        newRange.setStart(range.startContainer, range.startOffset - word.length);
        newRange.setEnd(range.startContainer, range.startOffset);
        sel.removeAllRanges();
        sel.addRange(newRange);
      } else return;
    }
    const caseSensitive = document.getElementById('case-toggle').checked;
    const content = caseSensitive ? Editor.content : Editor.content.toLowerCase();
    const q = caseSensitive ? word : word.toLowerCase();
    const selRange = sel.getRangeAt(0);
    const preRange = selRange.cloneRange();
    preRange.selectNodeContents(document.getElementById('code-display'));
    preRange.setEnd(selRange.endContainer, selRange.endOffset);
    const offset = preRange.toString().length;
    const nextIdx = content.indexOf(q, offset);
    if (nextIdx >= 0) {
      const display = document.getElementById('code-display');
      const range = document.createRange();
      let charCount = 0;
      const walker = document.createTreeWalker(display, NodeFilter.SHOW_TEXT);
      let node = walker.nextNode();
      while (node && charCount + node.textContent.length <= nextIdx) {
        charCount += node.textContent.length;
        node = walker.nextNode();
      }
      if (node) {
        const start = nextIdx - charCount;
        const end = Math.min(start + word.length, node.textContent.length);
        range.setStart(node, Math.max(0, start));
        range.setEnd(node, end);
        sel.addRange(range);
      }
    }
    Editor.highlightCurrentWord();
  },

  selectAllOccurrences() {
    const sel = window.getSelection();
    const word = sel.toString().trim();
    if (!word) return;
    document.getElementById('search-input').value = word;
    this.findNext();
  },

  // ---- Line Operations ----
  duplicateLine() {
    const lines = Editor.content.split('\n');
    const idx = Editor.cursorLine - 1;
    lines.splice(idx, 0, lines[idx]);
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    Editor.setCursor(Editor.cursorLine + 1, Editor.cursorCol);
  },

  duplicateLineUp() {
    const lines = Editor.content.split('\n');
    const idx = Editor.cursorLine - 1;
    lines.splice(idx, 0, lines[idx]);
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  duplicateLineDown() {
    const lines = Editor.content.split('\n');
    const idx = Editor.cursorLine - 1;
    lines.splice(idx + 1, 0, lines[idx]);
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    Editor.setCursor(Editor.cursorLine + 1, Editor.cursorCol);
  },

  deleteLine() {
    const lines = Editor.content.split('\n');
    if (lines.length === 1) { Editor.content = ''; }
    else { lines.splice(Editor.cursorLine - 1, 1); Editor.content = lines.join('\n'); }
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    if (Editor.cursorLine > lines.length) Editor.setCursor(lines.length, 1);
  },

  moveLineUp() {
    const lines = Editor.content.split('\n');
    const idx = Editor.cursorLine - 1;
    if (idx === 0) return;
    [lines[idx - 1], lines[idx]] = [lines[idx], lines[idx - 1]];
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    Editor.setCursor(Editor.cursorLine - 1, Editor.cursorCol);
  },

  moveLineDown() {
    const lines = Editor.content.split('\n');
    const idx = Editor.cursorLine - 1;
    if (idx >= lines.length - 1) return;
    [lines[idx], lines[idx + 1]] = [lines[idx + 1], lines[idx]];
    Editor.content = lines.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    Editor.setCursor(Editor.cursorLine + 1, Editor.cursorCol);
  },

  sortLinesAsc() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    if (selectedText.includes('\n')) {
      const sorted = selectedText.split('\n').sort().join('\n');
      document.execCommand('insertText', false, sorted);
    } else {
      const lines = Editor.content.split('\n');
      lines.sort((a, b) => a.localeCompare(b));
      Editor.content = lines.join('\n');
    }
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  sortLinesDesc() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    if (selectedText.includes('\n')) {
      const sorted = selectedText.split('\n').sort((a, b) => b.localeCompare(a)).join('\n');
      document.execCommand('insertText', false, sorted);
    } else {
      const lines = Editor.content.split('\n');
      lines.sort((a, b) => b.localeCompare(a));
      Editor.content = lines.join('\n');
    }
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  removeDuplicateLines() {
    const lines = Editor.content.split('\n');
    const unique = [...new Set(lines)];
    Editor.content = unique.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  reverseLines() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    if (selectedText.includes('\n')) {
      const reversed = selectedText.split('\n').reverse().join('\n');
      document.execCommand('insertText', false, reversed);
    } else {
      const lines = Editor.content.split('\n');
      lines.reverse();
      Editor.content = lines.join('\n');
    }
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  // ---- Indentation ----
  indent() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    const indent = Editor.useSpaces ? ' '.repeat(Editor.tabSize) : '\t';
    if (selectedText.includes('\n')) {
      const indented = indent + selectedText.split('\n').join('\n' + indent);
      document.execCommand('insertText', false, indented);
    } else {
      const lines = Editor.content.split('\n');
      const idx = Editor.cursorLine - 1;
      lines[idx] = indent + lines[idx];
      Editor.content = lines.join('\n');
      Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    }
  },

  outdent() {
    const sel = window.getSelection();
    const selectedText = sel.toString();
    if (selectedText.includes('\n')) {
      const outdented = selectedText.split('\n').map(l => l.replace(/^(\s{1,4}|\t)/, '')).join('\n');
      document.execCommand('insertText', false, outdented);
    } else {
      const lines = Editor.content.split('\n');
      const idx = Editor.cursorLine - 1;
      lines[idx] = lines[idx].replace(/^(\s{1,4}|\t)/, '');
      Editor.content = lines.join('\n');
      Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    }
  },

  cycleIndent() {
    Editor.cycleIndentUnit();
  },

  // ---- Whitespace ----
  trimTrailingWhitespace() {
    const lines = Editor.content.split('\n');
    let changed = false;
    for (let i = 0; i < lines.length; i++) {
      const trimmed = lines[i].trimEnd();
      if (trimmed !== lines[i]) { lines[i] = trimmed; changed = true; }
    }
    if (changed) {
      Editor.content = lines.join('\n');
      Editor.pushUndo(); Editor.render(); Editor.updateGutter();
    }
  },

  // ---- Format ----
  formatDocument() {
    const lines = Editor.content.split('\n');
    let indentLevel = 0;
    const indentStr = Editor.useSpaces ? ' '.repeat(Editor.tabSize) : '\t';
    const openBraces = new Set(['{', '(', '[']);
    const closeBraces = new Set(['}', ')', ']']);
    const formatted = lines.map(line => {
      const trimmed = line.trim();
      if (trimmed.length === 0) return '';
      for (const ch of trimmed) { if (closeBraces.has(ch)) indentLevel = Math.max(0, indentLevel - 1); break; }
      const result = indentStr.repeat(indentLevel) + trimmed;
      for (const ch of trimmed) { if (openBraces.has(ch)) indentLevel++; break; }
      return result;
    });
    Editor.content = formatted.join('\n');
    Editor.pushUndo(); Editor.render(); Editor.updateGutter();
  },

  // ---- Bookmarks ----
  toggleBookmark(line) { Editor.toggleBookmark(line || Editor.cursorLine); },
  gotoNextBookmark() {
    const sorted = Editor.getSortedBookmarks();
    if (sorted.length === 0) return;
    const next = sorted.find(b => b > Editor.cursorLine) || sorted[0];
    Editor.setCursor(next, 1);
  },
  gotoPrevBookmark() {
    const sorted = Editor.getSortedBookmarks();
    if (sorted.length === 0) return;
    const prev = [...sorted].reverse().find(b => b < Editor.cursorLine) || sorted[sorted.length - 1];
    Editor.setCursor(prev, 1);
  },

  _selectLine() {
    const lines = Editor.content.split('\n');
    const line = lines[Editor.cursorLine - 1] || '';
    const startIdx = lines.slice(0, Editor.cursorLine - 1).join('\n').length + (Editor.cursorLine > 1 ? 1 : 0);
    const display = document.getElementById('code-display');
    const walker = document.createTreeWalker(display, NodeFilter.SHOW_TEXT);
    let charCount = 0, node = walker.nextNode();
    while (node && charCount + node.textContent.length <= startIdx) { charCount += node.textContent.length; node = walker.nextNode(); }
    if (node) {
      const s = startIdx - charCount;
      const e = Math.min(s + line.length, node.textContent.length);
      const range = document.createRange();
      range.setStart(node, s); range.setEnd(node, e);
      const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);

    { label: 'Remove Duplicate Lines', icon: '▶', category: 'Edit', action: () => EditorActions.removeDuplicateLines() },
    { label: 'Reverse Lines', icon: '▶', category: 'Edit', action: () => EditorActions.reverseLines() },
    { label: 'Trim Trailing Whitespace', icon: '▶', category: 'Edit', action: () => EditorActions.trimTrailingWhitespace() },
    { label: 'Undo', shortcut: 'Ctrl+Z', icon: '▶', category: 'Edit', action: () => Editor.undo() },
    { label: 'Redo', shortcut: 'Ctrl+Y', icon: '▶', category: 'Edit', action: () => Editor.redo() },
    { label: 'Fold All', icon: '▶', category: 'View', action: () => EditorActions.foldAll() },
    { label: 'Unfold All', icon: '▶', category: 'View', action: () => EditorActions.unfoldAll() },
    { label: 'Toggle Bookmark', shortcut: 'Ctrl+B', icon: '▶', category: 'Edit', action: () => EditorActions.toggleBookmark() },
    { label: 'Clear All Bookmarks', icon: '▶', category: 'Edit', action: () => EditorActions.clearAllBookmarks() },
    { label: 'Rename Symbol', shortcut: 'F2', icon: '▶', category: 'Refactor', action: () => EditorActions.renameSymbol() },
    { label: 'Change Encoding', icon: '▶', category: 'File', action: () => EditorActions.showEncodingDropdown() },
    { label: 'Toggle Terminal', icon: '▶', category: 'View', action: () => EditorActions.showPanelTab('terminal') },
    { label: 'Toggle Output', icon: '▶', category: 'View', action: () => EditorActions.showPanelTab('output') },
    { label: 'Toggle Problems', icon: '▶', category: 'View', action: () => EditorActions.showPanelTab('problems') },
    { label: 'Indent with Spaces', icon: '▶', category: 'Settings', action: () => { Editor.useSpaces = true; Editor.updateStatusBar(); } },
    { label: 'Indent with Tabs', icon: '▶', category: 'Settings', action: () => { Editor.useSpaces = false; Editor.updateStatusBar(); } },
    { label: 'Increase Font Size', icon: '▶', category: 'View', action: () => { const s = parseInt(getComputedStyle(document.getElementById('code-display')).fontSize); Editor.setFontSize(Math.min(s + 1, 32)); } },
    { label: 'Decrease Font Size', icon: '▶', category: 'View', action: () => { const s = parseInt(getComputedStyle(document.getElementById('code-display')).fontSize); Editor.setFontSize(Math.max(s - 1, 8)); } },
  ],

  _renderCommands(filter) {
    const items = document.getElementById('cmd-items');
    const lf = filter.toLowerCase();
    const filtered = lf ? this._commands.filter(c => c.label.toLowerCase().includes(lf) || c.category.toLowerCase().includes(lf)) : this._commands;
    items.innerHTML = filtered.map((c, i) =>
      `<div class="item ${i === 0 ? 'selected' : ''}" onclick="EditorActions._executeCommand(${this._commands.indexOf(c)})"><span class="icon">${c.icon}</span>${c.label}<span class="shortcut">${c.shortcut || ''}</span><span class="cat">${c.category}</span></div>`
    ).join('');
  },

  _executeCommand(index) {
    const cmd = this._commands[index];
    if (cmd && cmd.action) cmd.action();
    document.getElementById('command-palette').classList.remove('visible');
  },

  navigateToBreadcrumb(index) { /* Navigate to file path segment — callback to Kotlin */ },

  closeAllPanels() {
    document.getElementById('search-panel').classList.remove('visible');
    document.getElementById('command-palette').classList.remove('visible');
    document.getElementById('context-menu').classList.remove('visible');
    document.getElementById('goto-dialog').classList.remove('visible');
    document.getElementById('encoding-dropdown').classList.remove('visible');
  },

  // ---- Bottom Panels ----
  showPanelTab(tab) {
    const area = document.getElementById('panel-area');
    const isVisible = area.style.display === 'flex';
    if (!isVisible) { area.style.display = 'flex'; }
    document.querySelectorAll('.panel-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
    event.target.classList.add('active');
    document.getElementById(tab + '-panel').classList.add('visible');
  },

  closeBottomPanels() {
    document.getElementById('panel-area').style.display = 'none';
  },

  // ---- Output ----
  appendOutput(text) {
    const panel = document.getElementById('output-panel');
    panel.classList.add('visible');
    panel.innerHTML += `<div>${text.replace(/</g,'&lt;')}</div>`;
    panel.scrollTop = panel.scrollHeight;
  },

  clearOutput() { document.getElementById('output-panel').innerHTML = ''; },

  setProblems(problems) {
    const panel = document.getElementById('problems-panel');
    panel.classList.toggle('visible', problems.length > 0);
    panel.innerHTML = problems.map(p =>
      `<div class="problem ${p.severity}" onclick="EditorActions.gotoLine(${p.line})"><span>${p.severity === 'error' ? '✕' : p.severity === 'warning' ? '⚠' : 'ℹ'}</span><span>${p.message}</span><span class="loc">${p.file}:${p.line}</span></div>`
    ).join('');
  },

  // ---- Snippets ----
  insertSnippet(name) {
    const snippets = Editor.snippets[Editor.language] || Editor.snippets['text'] || {};
    const snippet = snippets[name];
    if (!snippet) return;
    let text = snippet;
    // Process tab stops
    const tabstops = snippet.match(/\$(\d+)|\$\{(\d+)(?::([^}]*))?}/g) || [];
    tabstops.forEach(match => {
      const num = match.replace(/[${}:]/g, '');
      text = text.replace(match, num === '0' ? '' : `placeholder${num}`);
    });
    Editor.insertText(text);
  },

  loadSnippets(lang, snippets) { Editor.snippets[lang] = snippets; },

  // ---- View toggles ----
  toggleMinimap() { Editor.toggleMinimap(); },
  toggleWordWrap() { Editor.setWordWrap(!Editor.wordWrap); },
};

// Initialize
Editor.init();
</script>
</body>
</html>
